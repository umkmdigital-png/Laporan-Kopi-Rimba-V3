<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini POS Kopi Rimba</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <div class="brand-sub">KOPI RIMBA MAZBOY GROUP</div>
    <h1 class="brand-main">Sistem Laporan Harian</h1>
</div>

<div class="container">
    <div id="tab-absen" class="tab-content active">
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar">☕</div>
                <div>
                    <p class="welcome-text">Selamat Bekerja,</p>
                    <h2 id="display-name">Nama Staff</h2>
                    <p id="display-role">Shift belum dipilih</p>
                </div>
            </div>
            <div class="profile-meta">
                <span>🕒 <strong id="live-clock">--:--:--</strong></span>
                <span>📍 <strong>Kopi Rimba Mazboy</strong></span>
            </div>
        </div>
        <div class="card card-input-area">
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input id="p_nama" type="text" placeholder="Input nama..." oninput="updateProfile()">
            </div>
            <div class="input-group">
                <label>Shift / Outlet</label>
                <select id="p_outlet" onchange="updateProfile()">
                    <option value="">-- Pilih Shift --</option>
                    <option>Kasir - Pagi</option>
                    <option>Kasir - Malam</option>
                </select>
            </div>
            <div class="input-group">
                <label>Modal Awal (Cash)</label>
                <input id="p_rupiah" type="text" placeholder="Rp 0" onkeyup="fmtRp(this); if(typeof calcTotal === 'function') calcTotal();">
            </div>
            <button class="btn-primary" onclick="doCheckin()">KONFIRMASI MULAI KERJA</button>
        </div>
    </div>

    <div id="tab-penjualan" class="tab-content">
        <div class="card">
            <div class="card-title">📋 Pilih Menu</div>
            <div class="menu-grid" id="menu-grid"></div>
        </div>
        
        <div class="card">
            <div class="card-title">💸 Pengeluaran (Opsional)</div>
            <div class="expense-input-row">
                <input id="exp-name" type="text" placeholder="Barang (Contoh: Gas)">
                <input id="exp-price" type="text" placeholder="Rp 0" onkeyup="fmtRp(this)">
                <button class="btn-add-exp" onclick="addExpense()">+</button>
            </div>
            <div id="expense-list"></div>
            <div class="input-group" style="margin-top:10px">
                <label>Total Pengeluaran</label>
                <input id="p_keluar" readonly class="total-bold-gray" value="Rp 0">
            </div>
        </div>

        <div class="card">
            <div class="card-title">💰 Perhitungan Keuangan</div>
            <div class="input-group">
                <label>Modal Awal (Dari Check-in)</label>
                <input id="p_modal_readonly" readonly class="total-bold-gray" value="Rp 0">
            </div>
            
            <div class="total-summary-grid" style="grid-template-columns: 1fr 1fr;">
                <div>
                    <label>Total Omzet</label>
                    <div class="val" id="total-omzet-val">Rp 0</div>
                </div>
                <div>
                    <label>Omzet Tunai</label>
                    <div class="val" id="total-tunai-omzet-val" style="color: #2e7d32;">Rp 0</div>
                </div>
                <div>
                    <label>Omzet QRIS</label>
                    <div class="val" id="total-qris-val" style="color: #1976d2;">Rp 0</div>
                </div>
                <div>
                    <label>Omzet Online</label>
                    <div class="val" id="total-online-val" style="color: #f57c00;">Rp 0</div>
                </div>
            </div>
            
            <div class="input-group" style="margin-top: 15px;">
                <label style="font-size: 13px; color: #d32f2f;">Setoran Tunai Bersih (Modal + Tunai - Keluar - QRIS/Onl)</label>
                <input id="total-setoran-val" readonly class="total-bold-gray" value="Rp 0" style="border-color:#d32f2f; color:#d32f2f; font-size:18px;">
            </div>
            <button class="btn-dark" onclick="checkout()">⚡ KIRIM LAPORAN KE WHATSAPP</button>
            
            <button onclick="confirmResetDarurat()" style="margin-top: 12px; width: 100%; padding: 12px; background: #fff; color: #d32f2f; border: 2px dashed #d32f2f; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s;">
                🚨 RESET DATA DARURAT
            </button>
        </div>

        <div class="manual-input-card card">
            <h4>➕ Tambah Menu Custom</h4>
            <div class="input-group">
                <input type="text" id="manual_name" placeholder="Nama Item (Misal: Tambahan Saus)" />
            </div>
            <div class="input-group">
                <input type="text" id="manual_price" placeholder="Harga (Misal: 5000)" onkeyup="fmtRp(this)" />
            </div>
            <button class="btn-primary" onclick="addManualMenu()">Tambahkan ke Keranjang</button>
        </div>

        <div class="card">
            <h4 style="font-size: 14px; margin-bottom: 10px; color: #4a5568;">💳
